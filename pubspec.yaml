name: learncode
description: "Neon coding game — учись программировать играя"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI и тема
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1

  # Навигация
  go_router: ^14.2.0

  # Хранилище и состояние
  shared_preferences: ^2.3.2
  provider: ^6.1.2

  # Сеть и БД (пока не используем, но пусть будет)
  supabase_flutter: ^2.6.0
  http: ^1.2.2

  # Утилиты
  uuid: ^4.5.1
  intl: ^0.19.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true